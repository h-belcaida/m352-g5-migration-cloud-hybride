<rect x="50" y="1088" width="1953" height="170" rx="18" fill="#F5F5F5" stroke="#8C8C8C" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>
<text x="1026.5" y="1134" font-size="23" fill="#262626" text-anchor="middle" font-weight="bold">SOLUTION LOCALE DE SECOURS (si DigitalOcean est indisponible)</text>
<text x="1026.5" y="1180" font-size="20" fill="#404040" text-anchor="middle">Edge-VM et web-app sont recréées dans VMware sur deux réseaux isolés, derrière une 2e instance OPNsense jouant le rôle du fournisseur cloud.</text>
<text x="1026.5" y="1216" font-size="20" fill="#404040" text-anchor="middle">Même plan d'adressage, même tunnel WireGuard, mêmes règles et mêmes tests.</text>
