[Interface]
Address = 10.8.0.1/24
ListenPort = 51820
PrivateKey = [server private key]

PostUp   = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE; iptables -t nat -A POSTROUTING -o eth1 -j MASQUERADE
PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE; iptables -t nat -D POSTROUTING -o eth1 -j MASQUERADE

[Peer]
# client 1
PublicKey = [client public key]
AllowedIPs = 10.8.0.2/32
