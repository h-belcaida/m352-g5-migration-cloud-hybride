# VM1 edge : page publique + accès à l'intranet de VM2
server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /intranet/ {
        proxy_pass http://10.0.2.10/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
